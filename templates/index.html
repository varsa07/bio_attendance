<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Biometric Attendance System</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #eef2f5; margin: 0; padding: 20px; text-align: center; }
        .card { background: white; padding: 25px; border-radius: 12px; max-width: 480px; margin: 20px auto; box-shadow: 0 4px 15px rgba(0,0,0,0.08); }
        video, canvas { width: 100%; border-radius: 8px; border: 2px solid #ddd; margin-top: 10px; }
        input[type="text"], input[type="password"], input[type="file"] { width: 90%; padding: 10px; margin: 8px 0; border: 1px solid #ccc; border-radius: 6px; }
        button { background-color: #007bff; color: white; border: none; padding: 12px; border-radius: 6px; cursor: pointer; font-size: 15px; width: 95%; margin-top: 10px; font-weight: bold; }
        button.scan-btn { background-color: #28a745; }
        button.check-btn { background-color: #17a2b8; }
        button.teacher-btn { background-color: #6c757d; }
    </style>
</head>
<body>

    <h2>Smart Biometric Face Attendance System</h2>

    <!-- 1. New Student Registration (First Step) -->
    <div class="card">
        <h3>1. New Student Registration</h3>
        <form action="/register" method="POST" enctype="multipart/form-data">
            <input type="text" name="name" placeholder="Student Full Name" required><br>
            <input type="text" name="student_id" placeholder="Roll Number / UID" required><br>
            <label style="font-size:13px; color:#666; display:block; text-align:left; padding-left:15px;">Upload Reference Face Photo:</label>
            <input type="file" name="photo" accept="image/*" required><br>
            <button type="submit">Register Student & Save Photo</button>
        </form>
    </div>

    <!-- 2. Daily Face Scan & Match (Second Step) -->
    <div class="card">
        <h3>2. Daily Face Scan Attendance</h3>
        <video id="webcam" autoplay playsinline></video>
        <canvas id="canvas" style="display:none;"></canvas>
        <input type="text" id="scan_uid" placeholder="Enter Your Roll No / UID" required><br>
        <button class="scan-btn" onclick="verifyAndMark()">📷 Scan Face & Mark Attendance</button>
    </div>

    <!-- 3. Student Self-Check Portal -->
    <div class="card">
        <h3>3. Student Portal (Check Attendance)</h3>
        <form action="/check-student-attendance" method="POST">
            <input type="text" name="student_id" placeholder="Enter Your Roll No / UID" required><br>
            <button type="submit" class="check-btn">🔍 View My Attendance</button>
        </form>
    </div>

    <!-- 4. Teacher Secure Section -->
    <div class="card">
        <h3>4. Teacher Section</h3>
        <form action="/teacher-dashboard" method="POST">
            <input type="password" name="password" placeholder="Enter Teacher Password" required><br>
            <button type="submit" class="teacher-btn">📊 Open Teacher Dashboard</button>
        </form>
    </div>

    <script>
        const video = document.getElementById('webcam');
        navigator.mediaDevices.getUserMedia({ video: true })
            .then(stream => { video.srcObject = stream; })
            .catch(err => { console.error("Camera error:", err); });

        function verifyAndMark() {
            const uid = document.getElementById('scan_uid').value;
            if(!uid) {
                alert("Please enter your UID first!");
                return;
            }

            const canvas = document.getElementById('canvas');
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            
            const imageData = canvas.toDataURL('image/png');

            fetch('/mark-attendance', {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: 'student_id=' + encodeURIComponent(uid) + '&image=' + encodeURIComponent(imageData)
            }).then(response => response.text()).then(html => {
                document.open();
                document.write(html);
                document.close();
            });
        }
    </script>
</body>
</html>
