<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biometric Attendance System</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f7f6; margin: 20px; text-align: center; }
        .card { background: white; padding: 20px; border-radius: 8px; max-width: 400px; margin: 15px auto; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        input[type="text"] { width: 90%; padding: 8px; margin: 8px 0; border: 1px solid #ccc; border-radius: 4px; }
        button { background-color: #007bff; color: white; border: none; padding: 10px 15px; border-radius: 4px; cursor: pointer; font-size: 15px; width: 95%; margin-top: 5px; }
        button.scan { background-color: #28a745; }
    </style>
</head>
<body>
    <h2>Biometric Attendance System</h2>

    <!-- Student Registration -->
    <div class="card">
        <h3>1. Student Register Karein</h3>
        <form action="/register" method="POST">
            <input type="text" name="name" placeholder="Student ka Name" required><br>
            <input type="text" name="student_id" placeholder="Student Roll No / UID" required><br>
            <button type="submit">Save Student Details</button>
        </form>
    </div>

    <!-- Attendance Scanner -->
    <div class="card">
        <h3>2. Attendance Scan / Mark</h3>
        <form action="/mark-attendance" method="POST">
            <input type="text" name="student_id" placeholder="Enter UID / Scan Face" required><br>
            <button type="submit" class="scan">Mark Attendance</button>
        </form>
    </div>
</body>
</html>
